name: "Regression Test - Users' privacy (Webbkoll backend) Test"
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '**.md'
      - '**software-full.json'
      - '**software-sources.json'
      - '**update-software.yml'
      - '**update_software_helper.py'
      - '**software-rules.json'
      - 'Dockerfile'
      - '**regression-test-404.yml'
      - '**regression-test-a11y-statement.yml'
      - '**regression-test-docker-image.yml'
      - '**regression-test-email.yml'
      - '**regression-test-energy-efficiency.yml'
      - '**regression-test-google-lighthouse-based.yml'
      - '**regression-test-http.yml'
      - '**regression-test-lint-css.yml'
      - '**regression-test-lint-html.yml'
      - '**regression-test-lint-js.yml'
      - '**regression-test-pa11y.yml'
      - '**regression-test-sitespeed-browsertime-har.yml'
      - '**regression-test-sitespeed.yml'
      - '**regression-test-software.yml'
      - '**regression-test-standard-files.yml'
      - '**regression-test-tracking.yml'
      - '**regression-test-translations.yml'
      - '**regression-test-webbkoll.yml'
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
            matrix:
                os: [ubuntu-latest]
                version: [31]
    steps:
    - name: Check out repository code
      uses: actions/checkout@v7
    - name: Setup python
      uses: actions/setup-python@v7
      with:
        python-version: '3.13' # Version range or exact version of a Python version to use, using SemVer's version range syntax
        architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
    - name: Setup dependencies using pip
      run: pip install -r requirements.txt
    - name: Setup Node.js (v4 version 24.x)
      uses: actions/setup-node@v7
      with:
        node-version: '24.x'
        check-latest: true
    - name: Setup npm packages
      run: npm install
      timeout-minutes: 30
    # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, so
    # Chrome started by webbkoll-backend can't set up its sandbox and fails to
    # launch. Allow them instead of running Chrome with --no-sandbox.
    - if: ${{ matrix.os == 'ubuntu-latest' }}
      name: Allow Chrome's sandbox (unprivileged user namespaces)
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - if: ${{ matrix.os == 'ubuntu-latest' }}
      name: RUNNING TEST - LINUX
      run: |
         python default.py -t ${{ matrix.version }} -r -i defaults/sites.json -o data/testresult-${{ matrix.version }}.json
         python .github/workflows/verify_result.py -t ${{ matrix.version }}
    # The backend writes the reason for a failed check to its own log only.
    - if: ${{ failure() }}
      name: Show webbkoll-backend log
      run: tail -n 50 node_modules/webbkoll-backend/webbkoll-backend.log || true
